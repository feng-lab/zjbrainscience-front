stages:
  - install
  - test
  - build
  - deploy

# 安装依赖阶段
install_dependencies:
  stage: install
  image: node:20 # 使用 Node.js 官方 Docker 镜像
  script:
    - echo "=======start install========"
    - npm install # 安装项目依赖
    - echo "=======end install========"
  artifacts:
    expire_in: 60 mins
    paths:
      - node_modules/ # 保留构建产物，以便在后续阶段使用

# 构建应用阶段
build_app:
  stage: build
  script:
    - echo "=======start build========"
    - npm run build # 构建 Vue.js 项目
    - echo "=======end build========"
  artifacts:
    paths:
      - dist # 保留构建产物，以便在后续阶段使用
